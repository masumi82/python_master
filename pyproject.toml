[project]
name = "python-master"
version = "0.1.0"
description = "Python 習熟演習"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
addopts = "-q --tb=short"

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/W: 書式、F: 未使用や未定義、B: バグになりやすい書き方、UP: 古い書き方
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]
